<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Codico logo</title>
  <desc id="desc">A luminous C-shaped coding agent surrounding a terminal face.</desc>
  <defs>
    <linearGradient id="codicoGradient" x1="88" y1="84" x2="430" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.48" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="promptGradient" x1="292" y1="211" x2="372" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientTransform="translate(256 235) rotate(90) scale(248)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12294B"/>
      <stop offset="1" stop-color="#050914"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.18 0 0 0 0 0.55 0 0 0 0 1 0 0 0 .55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#bgGlow)"/>
  <rect x="21.5" y="21.5" width="469" height="469" rx="114.5" fill="none" stroke="#233A63" stroke-width="3"/>

  <!-- The C is deliberately open on the right: Codico is a coding loop with an exit/output edge. -->
  <path
    d="M386 139
       C345 98 303 78 250 78
       C153 78 82 153 82 256
       C82 359 153 434 250 434
       C305 434 348 413 389 370"
    fill="none"
    stroke="url(#codicoGradient)"
    stroke-width="76"
    stroke-linecap="round"
    filter="url(#softGlow)"/>

  <!-- Agent / terminal face -->
  <path
    d="M210 174
       C210 151 229 132 252 132
       H334
       C369 132 398 161 398 196
       V316
       C398 351 369 380 334 380
       H252
       C229 380 210 361 210 338
       Z"
    fill="#07111F"
    stroke="#243E6A"
    stroke-width="6"/>

  <!-- Agent eye -->
  <rect x="247" y="218" width="22" height="66" rx="11" fill="#F8FAFC"/>

  <!-- Code prompt -->
  <path d="M304 219 L335 250 L304 281" fill="none" stroke="url(#promptGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M347 282 H374" fill="none" stroke="url(#promptGradient)" stroke-width="18" stroke-linecap="round"/>
</svg>
