name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test


  extension-host:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Install VS Code test harness
        run: npm install --no-save @vscode/test-electron@2.5.2
      - name: Run Extension Host smoke test
        run: xvfb-run -a node tests/vscode/runTest.js


  vsix:
    needs: [test, extension-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build VSIX
        run: npx --yes @vscode/vsce package --out codico.vsix
      - name: Verify VSIX
        run: test -s codico.vsix
      - name: Install VS Code test harness
        run: npm install --no-save @vscode/test-electron@2.5.2
      - name: Smoke-install packaged VSIX
        run: node tests/vscode/installVsix.js codico.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: codico-vsix
          path: codico.vsix
