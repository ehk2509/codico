name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the packaged VSIX to the Visual Studio Marketplace
        type: boolean
        default: false
      publish_openvsx:
        description: Publish the packaged VSIX to Open VSX
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Validate tag matches package version
        if: github.event_name == 'push'
        run: |
          node -e "const v=require('./package.json').version; const expected='v'+v; if (process.env.GITHUB_REF_NAME!==expected) { console.error('Tag '+process.env.GITHUB_REF_NAME+' must match '+expected); process.exit(1); }"

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out codico.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: codico-vsix
          path: codico.vsix

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" codico.vsix --generate-notes --verify-tag

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || (echo "VSCE_PAT secret is required" && exit 1)
          npx --yes @vscode/vsce publish --packagePath codico.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: github.event_name == 'workflow_dispatch' && inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || (echo "OVSX_PAT secret is required" && exit 1)
          npx --yes ovsx publish codico.vsix -p "$OVSX_PAT"
