name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the packaged VSIX to the Visual Studio Marketplace
        type: boolean
        default: false
      publish_openvsx:
        description: Publish the packaged VSIX to Open VSX
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Install VS Code test harness
        run: npm install --no-save @vscode/test-electron@2.5.2
      - name: Run Extension Host smoke test
        run: xvfb-run -a node tests/vscode/runTest.js

      - name: Resolve and validate release tag
        id: release
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF_NAME" == release/v* ]]; then
            tag="${GITHUB_REF_NAME#release/}"
          else
            echo "Unsupported release ref: $GITHUB_REF"
            exit 1
          fi
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$tag" != "$expected" ]]; then
            echo "Release ref $tag must match package version $expected"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create tag from validated release branch
        if: startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $TAG points to $existing, expected $GITHUB_SHA"
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out codico.vsix
      - name: Smoke-install packaged VSIX
        run: node tests/vscode/installVsix.js codico.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: codico-vsix
          path: codico.vsix

      - name: Create or update GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" codico.vsix --clobber
          else
            gh release create "$TAG" codico.vsix --target "$GITHUB_SHA" --generate-notes --verify-tag
          fi

      - name: Publish to Visual Studio Marketplace
        if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || (echo "VSCE_PAT secret is required" && exit 1)
          npx --yes @vscode/vsce publish --packagePath codico.vsix -p "$VSCE_PAT"

      - name: Publish to Open VSX
        if: github.event_name == 'workflow_dispatch' && inputs.publish_openvsx
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || (echo "OVSX_PAT secret is required" && exit 1)
          npx --yes ovsx publish codico.vsix -p "$OVSX_PAT"
