name: Coding Holdout

on:
  pull_request:
    branches: [fix/review-request-examples]
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to run (claude-code and oracle are references to compare Codico with)
        required: true
        default: codico
        type: choice
        options: [codico, claude-code, oracle, noop]
      model:
        description: Model ID (OpenRouter for codico; Claude model or empty for claude-code; ignored for oracle)
        required: false
        default: deepseek/deepseek-v4-flash
        type: string
      escalation_model:
        description: Codico only — a stronger OpenRouter model the task is handed to when the reviewer disputes it or it stalls (empty = off)
        required: false
        default: ''
        type: string
      effort:
        description: Codico only — reasoning effort asked of the model (empty = Codico's default, medium)
        required: false
        default: ''
        type: string
      acco:
        description: Codico only — optimize provider requests through a local ACCO SDK service (pip install acco)
        required: false
        default: false
        type: boolean
      suite:
        description: Task suite file (eval/tasks.json is the frozen holdout)
        required: false
        default: eval/tasks.json
        type: string
      filter:
        description: Regex matched against task id or category
        required: true
        default: .*
        type: string
      limit:
        description: Max tasks to run (0 = all frozen tasks)
        required: true
        default: '4'
        type: string
      repetitions:
        description: Trials per selected task
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  coding-holdout:
    # One scoped same-repo PR holdout; forks never receive secrets.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/agent-acceptance-surface-evidence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        if: inputs.acco
        with:
          python-version: '3.12'

      - name: Install and start ACCO SDK service
        if: inputs.acco
        run: |
          python -m pip install --upgrade acco
          acco sdk-serve . > /tmp/acco-sdk.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8770/v1/health > /tmp/acco-health.json; then cat /tmp/acco-health.json; exit 0; fi
            sleep 1
          done
          echo "ACCO did not become healthy"; cat /tmp/acco-sdk.log; exit 1

      - name: Install Claude Code
        if: inputs.agent == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run frozen historical coding holdout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT: ${{ inputs.agent || 'codico' }}
          MODEL: ${{ inputs.model || 'anthropic/claude-sonnet-5.5' }}
          FILTER: ${{ inputs.filter || '^team-worker-names
          SUITE: ${{ inputs.suite || 'eval/tasks-unused.json' }}
          ESCALATION: ${{ inputs.escalation_model }}
          EFFORT: ${{ inputs.effort }}
          CODICO_EVAL_ACCO_ENABLED: ${{ inputs.acco && '1' || '0' }}
          CODICO_EVAL_ACCO_BASE_URL: http://127.0.0.1:8770
          LIMIT: ${{ inputs.limit || '0' }}
          REPETITIONS: ${{ inputs.repetitions || '3' }}
        run: |
          if [ "$AGENT" = codico ]; then test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = claude-code ]; then test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = oracle ] || [ "$AGENT" = noop ]; then MODEL=; fi
          xvfb-run -a npm run eval:coding -- \
            --agent "$AGENT" \
            --suite "${SUITE:-eval/tasks.json}" \
            ${MODEL:+--model "$MODEL"} \
            ${ESCALATION:+--escalation-model "$ESCALATION"} \
            ${EFFORT:+--effort "$EFFORT"} \
            --filter "$FILTER" \
            --limit "$LIMIT" \
            --repetitions "$REPETITIONS"

      - name: Scorecard
        if: always()
        run: for f in eval/results/*/summary.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codico-coding-holdout
          path: eval/results/
          if-no-files-found: warn
 }}
          SUITE: ${{ inputs.suite }}
          ESCALATION: ${{ inputs.escalation_model }}
          EFFORT: ${{ inputs.effort }}
          CODICO_EVAL_ACCO_ENABLED: ${{ inputs.acco && '1' || '0' }}
          CODICO_EVAL_ACCO_BASE_URL: http://127.0.0.1:8770
          LIMIT: ${{ inputs.limit }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          if [ "$AGENT" = codico ]; then test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = claude-code ]; then test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = oracle ] || [ "$AGENT" = noop ]; then MODEL=; fi
          xvfb-run -a npm run eval:coding -- \
            --agent "$AGENT" \
            --suite "${SUITE:-eval/tasks.json}" \
            ${MODEL:+--model "$MODEL"} \
            ${ESCALATION:+--escalation-model "$ESCALATION"} \
            ${EFFORT:+--effort "$EFFORT"} \
            --filter "$FILTER" \
            --limit "$LIMIT" \
            --repetitions "$REPETITIONS"

      - name: Scorecard
        if: always()
        run: for f in eval/results/*/summary.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codico-coding-holdout
          path: eval/results/
          if-no-files-found: warn
