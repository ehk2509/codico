name: Coding Holdout

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Agent to run (claude-code and oracle are references to compare Codico with)
        required: true
        default: codico
        type: choice
        options: [codico, claude-code, oracle]
      model:
        description: Model ID (OpenRouter for codico; Claude model or empty for claude-code; ignored for oracle)
        required: false
        default: deepseek/deepseek-v4-flash
        type: string
      filter:
        description: Regex matched against task id or category
        required: true
        default: .*
        type: string
      limit:
        description: Max tasks to run (0 = all frozen tasks)
        required: true
        default: '4'
        type: string
      repetitions:
        description: Trials per selected task
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  coding-holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Claude Code
        if: inputs.agent == 'claude-code'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run frozen historical coding holdout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          FILTER: ${{ inputs.filter }}
          LIMIT: ${{ inputs.limit }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          if [ "$AGENT" = codico ]; then test -n "$OPENROUTER_API_KEY" || (echo "OPENROUTER_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = claude-code ]; then test -n "$ANTHROPIC_API_KEY" || (echo "ANTHROPIC_API_KEY secret is required" && exit 1); fi
          if [ "$AGENT" = oracle ]; then MODEL=; fi
          xvfb-run -a npm run eval:coding -- \
            --agent "$AGENT" \
            ${MODEL:+--model "$MODEL"} \
            --filter "$FILTER" \
            --limit "$LIMIT" \
            --repetitions "$REPETITIONS"

      - name: Scorecard
        if: always()
        run: for f in eval/results/*/summary.md; do [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"; done; true

      - name: Upload holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codico-coding-holdout
          path: eval/results/
          if-no-files-found: warn
